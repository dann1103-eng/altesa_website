<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Iluminación — fotografía pendiente">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#17171C"/><stop offset=".55" stop-color="#121216"/><stop offset="1" stop-color="#1C1420"/>
 </linearGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#D8479F" stop-opacity="0"/>
  <stop offset=".5" stop-color="#FBE9F5" stop-opacity=".95"/>
  <stop offset="1" stop-color="#D8479F" stop-opacity="0"/>
 </linearGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#D8479F" stop-opacity=".30"/><stop offset="1" stop-color="#D8479F" stop-opacity="0"/>
 </radialGradient>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3"/>
  <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer></filter>
</defs>
<rect width="640" height="800" fill="url(#bg)"/>
<ellipse cx="320" cy="352" rx="300" ry="220" fill="url(#halo)"/>
<rect width="640" height="800" filter="url(#grain)" opacity=".9"/>
<g transform="translate(288 320)" fill="none" stroke="#F2D8E8" stroke-opacity=".55" stroke-width="2.1"
   stroke-linecap="round" stroke-linejoin="round"><path d="M8 34h48M20 26v16M32 22v20M44 26v16" transform="translate(-32 -32)"/></g>
<rect x="120" y="470" width="400" height="1.5" fill="url(#beam)"/>
<text x="320" y="524" text-anchor="middle" font-family="'Azeret Mono',ui-monospace,monospace"
      font-size="13" letter-spacing="4.5" fill="#E9C9DE" fill-opacity=".92">ILUMINACIÓN</text>
<text x="320" y="556" text-anchor="middle" font-family="'Instrument Sans',system-ui,sans-serif"
      font-size="14" letter-spacing=".4" fill="#8A8A96">Fotografía de producto pendiente</text>
<text x="320" y="580" text-anchor="middle" font-family="'Azeret Mono',ui-monospace,monospace"
      font-size="11" letter-spacing="1.4" fill="#5E5E69">/img/productos/</text>
</svg>
