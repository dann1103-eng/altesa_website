<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vitrina ALTESA · Destacados en video</title>
<meta name="description" content="Recorrido vertical por los productos destacados del catálogo ALTESA 2026. Guarde lo que le interese y pida la cotización por WhatsApp.">
<meta name="theme-color" content="#0B0B0E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css?v=20260819-10">
<link rel="stylesheet" href="assets/css/reel.css?v=20260819-10">
<link rel="preload" as="image" href="img/reel/intro.jpg">
</head>
<body class="reelbody" data-nochrome>

<div class="reel" id="reel">

  <!-- Fondo ambiental: el póster de la diapositiva activa, desenfocado -->
  <div class="reel__bg" id="reelBg" aria-hidden="true"><i></i><i></i></div>

  <header class="reel__top">
    <a class="rbtn rbtn--back" href="catalogo.html" aria-label="Volver al catálogo">
      <svg width="15" height="15" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M9 1L3 7l6 6" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>Catálogo</span>
    </a>
    <p class="reel__brand"><b>ALTESA</b><span>Vitrina</span></p>
    <button class="rbtn rbtn--bag" id="selOpen" type="button" aria-label="Abrir mi selección">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 4.5h11l-.9 10h-9.2z" stroke="currentColor" stroke-width="1.2"/><path d="M5.5 6.5v-3a2.5 2.5 0 015 0v3" stroke="currentColor" stroke-width="1.2"/></svg>
      <b id="selN"></b>
    </button>
  </header>

  <div class="reel__feed" id="feed" tabindex="-1"></div>

  <!-- Paginado lateral, solo escritorio -->
  <div class="reel__pager" id="pager" aria-hidden="true">
    <button class="rbtn rbtn--round" type="button" data-go="-1" aria-label="Anterior">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 9l6-6 6 6" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <div class="reel__ticks" id="ticks"></div>
    <button class="rbtn rbtn--round" type="button" data-go="1" aria-label="Siguiente">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 5l6 6 6-6" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </div>

  <!-- Barra de cotización: aparece cuando hay algo guardado -->
  <div class="reel__cart" id="reelCart" hidden>
    <button type="button" id="cartOpen">
      <b id="cartN">0</b><span>guardados</span>
    </button>
    <a id="cartWa" href="#" target="_blank" rel="noopener">
      Cotizar por WhatsApp
      <svg class="arw" width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M0 5h12M8.5 1.2 12.8 5 8.5 8.8" stroke="currentColor" stroke-width="1.3"/></svg>
    </a>
  </div>

  <p class="reel__aviso" id="reelAviso"></p>

  <!-- Pista de gesto en la primera visita -->
  <div class="reel__hint" id="hint" hidden>
    <span class="reel__hint__d"><i></i></span>
    <b>Deslice hacia arriba</b>
  </div>

</div>

<noscript>
  <div style="padding:3rem 1.5rem;text-align:center;color:#F4F1F3">
    <p>Esta vitrina necesita JavaScript.</p>
    <p><a href="catalogo.html" style="text-decoration:underline">Ver el catálogo completo</a></p>
  </div>
</noscript>

<script src="assets/js/data-catalogo.js?v=20260819-10"></script>
<script src="assets/js/data-proyectos.js?v=20260819-10"></script>
<script src="assets/js/data-reel.js?v=20260819-10"></script>
<script src="assets/js/site.js?v=20260819-10"></script>
<script src="assets/js/reel.js?v=20260819-10"></script>
</body>
</html>
